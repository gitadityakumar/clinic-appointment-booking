packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  emulate: ^0.12.3
  resend: ^6.34.1
  twilio: ^6.2.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: ^1.7.0
overrides:
  vite@*: "catalog:"
  undici: ">=7.30.2"
  postcss-selector-parser: ">=6.1.5"
  esbuild: ">=0.25.0"
  "@vitest/mocker": ">=5.0.3"
  "@vitest/browser": ">=5.0.5"
  "@vitest/ui": ">=5.0.5"
  vitest: ">=5.0.5"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
  workerd: true
